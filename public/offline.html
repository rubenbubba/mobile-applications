<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F1" />
    <title>You're offline | Vitrine</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f5f5f1;
        --text: #18201c;
        --secondary: #4c5651;
        --accent: #0e5e4e;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #111412;
          --text: #f2f4f1;
          --secondary: #bcc4be;
          --accent: #4fc3a6;
          --on-accent: #06251e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      h1 { font-size: 24px; line-height: 1.3; margin: 0 0 8px; }
      p { color: var(--secondary); margin: 0 0 24px; }
      a, button {
        display: block;
        width: 100%;
        min-height: 48px;
        box-sizing: border-box;
        padding: 12px 16px;
        border-radius: 12px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button { border: 0; background: var(--accent); color: var(--on-accent); margin-bottom: 8px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't saved on your device. Your last results are still available on your overview.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Go to your overview</a>
    </main>
  </body>
</html>
